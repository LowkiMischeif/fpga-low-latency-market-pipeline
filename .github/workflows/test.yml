name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: verilator lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: verilator --version
      - name: lint rtl
        run: make lint

      # Without this, CI never elaborates tb/ at all: `make lint` globs rtl/
      # only, so a syntax error in a testbench, an unresolved bind, or an
      # unconnected DUT port goes green here and surfaces only when someone
      # runs `make sim` locally. That happened for the whole of the
      # decode/validate branch.
      - name: lint testbenches
        run: make lint-tb

  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
