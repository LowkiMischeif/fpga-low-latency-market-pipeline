name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: verilator lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: verilator --version
      # Scaffold guard: skip until rtl/ has sources. Drop once market_pkg.sv lands.
      - name: lint rtl
        run: |
          shopt -s nullglob
          srcs=(rtl/*.sv)
          if [ ${#srcs[@]} -eq 0 ]; then echo "no RTL yet, skipping"; exit 0; fi
          make lint

  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # exit code 5 == "no tests collected", expected until scripts/ has tests.
      - run: pytest -q || [ $? -eq 5 ]
