# baseline
# HAND-CHOSEN, not trained. Spread-led: buy when the quoted spread is wide, sell when it is tight. Thresholds picked from the measured feature range of the test stimulus (spread 12..52). It exists to be a deliberately different policy from the trained one, on a different signal -- not as a tuner output.
# addr data  (both hex; CFG_COMMIT last)
00 00000000   # CFG_W0
01 00001000   # CFG_W_SPREAD
02 00000000   # CFG_W_IMBALANCE
03 00001000   # CFG_W_MOMENTUM
04 00000028   # CFG_THETA_BUY
05 0000000f   # CFG_THETA_SELL
06 00000005   # CFG_ORDER_QTY
07 000f4240   # CFG_MAX_LONG
08 000f4240   # CFG_MAX_SHORT
09 00000064   # CFG_MAX_ORDER_QTY
0a 00004e20   # CFG_MAX_SPREAD
0b 00000000   # CFG_KILL
0c 00000001   # CFG_COMMIT
